[Rainmeter]
Update=1000
OnRefreshAction=[!Delay 50][!Hide]["#@#Actions\AHKv1.exe" "#@#Actions\Source Code\Tessera.ahk"][!EnableMeasureGroup NUOl]
OncloseAction=["#@#Actions\AHKv1.exe" "#@#Actions\Source Code\Close.ahk"]
MouseoverAction=[!DisableMEasure ActionUNload]
MouseleaveAction=[!CommandMeasure Tick "Reset"][!EnableMeasure ActionUNload]
DefaultUpdateDivider=-1
MouseActionCursor=0
AccurateText=1
DefaultWindowX=0
DefaultWindowY=0
DefaultAlwaysOnTop=2
DefaultDraggable=0
DefaultSavePosition=1
DefaultKeepOnScreen=0
DynamicWindowSize=1

@includeCtx=#SKINSPATH##MosaicShell\CoreShell\}{CtxItms.inc

[Variables]
@includeVars=#@#Vars.inc
@includeLayoutVars=Vars\#Layout#.inc
NowPlayingMedia=AIMP
PlayerType=NP
mToggle=0

TweenNode1=1
SkinX=0
SkinY=0
SkinAX=0
SkinAY=0

CurrentSlider=mVolume
MusicVisible=0
StaticWin11Corner=0

; ---------------------------------------------------------------------------- ;
;                                   Functions                                  ;
; ---------------------------------------------------------------------------- ;

[Focus]
Measure=Plugin
Plugin=Focus

[Func]
Measure=Script
ScriptFile=#@#Lua\Func.lua
DynamicVariables=1

; ---------------------------------- Flyouts --------------------------------- ;

[FlightModeWatcher]
Measure=Plugin
Plugin=FlightModeWatcher
FlightModeChangeAction=[!UpdateMeasure #CURRENTSECTION#][!CommandMeasure "Func" "actionLoad('flight')"]
VolumeChangeAction=[!UpdateMeasure FlightModeVolumeWatcher]
IfCondition=FlightModeWatcher = 1
IfTrueAction=[!SetOption LocksIcon MeterStyle "String:S | FlightIcon.On:S"][!SetOption LocksText MeterStyle "String:S | FlightText.On:S"]#AdditionalToggleOnOptions#[!UpdateMeterGroup Locks][!Redraw]
IfFalseAction=[!SetOption LocksIcon MeterStyle "String:S | FlightIcon.Off:S"][!SetOption LocksText MeterStyle "String:S | FlightText.Off:S"]#AdditionalToggleOffOptions#[!UpdateMeterGroup Locks][!Redraw]

[FlightModeVolumeWatcher]
Measure=Plugin
Plugin=Win7AudioPlugin
OnChangeAction=[!CommandMeasure Func "CheckActionLoadVol()"]

[FlyoutsTrigger]
Measure=Plugin
Plugin=Tessera
BrightnessChangeAction=[!CommandMeasure "Func" "actionLoad('bright')"]
FlightModeChangeAction=[!CommandMeasure "Func" "actionLoad('flight')"]
MediaChangeAction=[!CommandMeasure "Func" "actionLoad('music')"]
VolumeChangeAction=[!CommandMeasure "Func" "actionLoad('vol')"]
FlightModeMeasure=FlightModeWatcher
UpdateDivider=2

; ---------------------------------- Sliders --------------------------------- ;

[VolumeMouse]
Measure=Plugin
Plugin=Mouse
LeftMouseDragAction=[!CommandMeasure Func "CalcSliderPercentage($MouseX$,$MouseY$)"]
LeftMouseUpAction=[!CommandMeasure VolumeMouse "Stop"]#SliderEndAction#
RelativeToSkin=1
RequireDragging=1
DynamicVariables=1

[SliderStart]
Measure=Calc
DynamicVariables=1
[SliderEnd]
Measure=Calc
DynamicVariables=1
OnUpdateAction=[!CommandMEasure Func "ImportSlider()"]

; -------------------------------- Activation -------------------------------- ;

@includeAni=#@#Includes\Ani#Ani#.inc

[Tick]
Measure=Loop
StartValue=0
EndValue=999
Increment=1
UpdateDivider=1

[ACTIONUNLOAD]
Measure=Calc
IfCondition=Tick = #TimeOut#
IfTrueAction=[!SetVariable mToggle 0][!CommandMeasure Tick "Reset"][!DisableMeasure Tick][!CommandMeasure ActionTimer "Stop 1"][!CommandMeasure ActionTImer "Execute 2"]
UpdateDivider=1

; ---------------------------------- Toggles --------------------------------- ;

[CapsLock]
Measure=Plugin
Plugin=HotKey
HotKey=CapsLock Status
IfCondition=CapsLock = 1
IfTrueAction=[!SetOption LocksIcon MeterStyle "String:S | LocksIcon.On:S"][!SetOption LocksText MeterStyle "String:S | LocksText.CapsLock.On:S"]#AdditionalToggleOnOptions#[!UpdateMeterGroup Locks][!Redraw]
IfFalseAction=[!SetOption LocksIcon MeterStyle "String:S | LocksIcon.Off:S"][!SetOption LocksText MeterStyle "String:S | LocksText.CapsLock.Off:S"]#AdditionalToggleOffOptions#[!UpdateMeterGroup Locks][!Redraw]
ifconditionmode=1
Group=Locks

[ScrollLock]
Measure=Plugin
Plugin=HotKey
HotKey=ScrollLock Status
IfCondition=ScrollLock = 1
IfTrueAction=[!SetOption LocksIcon MeterStyle "String:S | LocksIcon.On:S"][!SetOption LocksText MeterStyle "String:S | LocksText.ScrollLock.On:S"]#AdditionalToggleOnOptions#[!UpdateMeterGroup Locks][!Redraw]
IfFalseAction=[!SetOption LocksIcon MeterStyle "String:S | LocksIcon.Off:S"][!SetOption LocksText MeterStyle "String:S | LocksText.ScrollLock.Off:S"]#AdditionalToggleOffOptions#[!UpdateMeterGroup Locks][!Redraw]
ifconditionmode=1
Group=Locks

[NumLock]
Measure=Plugin
Plugin=HotKey
HotKey=NumLock Status
IfCondition=NumLock = 1
IfTrueAction=[!SetOption LocksIcon MeterStyle "String:S | LocksIcon.On:S"][!SetOption LocksText MeterStyle "String:S | LocksText.NumLock.On:S"]#AdditionalToggleOnOptions#[!UpdateMeterGroup Locks][!Redraw]
IfFalseAction=[!SetOption LocksIcon MeterStyle "String:S | LocksIcon.Off:S"][!SetOption LocksText MeterStyle "String:S | LocksText.NumLock.Off:S"]#AdditionalToggleOffOptions#[!UpdateMeterGroup Locks][!Redraw]
ifconditionmode=1
Group=Locks

; ---------------------------------- Styles ---------------------------------- ;

; Styles icons uses Material Icons Round as default
[LocksIcon.On:S]
Text=[\xe834]
[LocksIcon.Off:S]
Text=[\xe835]
[LocksText.CapsLock.On:S]
Text=Toggled CapsLock On
[LocksText.CapsLock.Off:S]
Text=Toggled CapsLock Off
[LocksText.ScrollLock.On:S]
Text=Toggled ScrollLock On
[LocksText.ScrollLock.Off:S]
Text=Toggled ScrollLock Off
[LocksText.NumLock.On:S]
Text=Toggled NumLock On
[LocksText.NumLock.Off:S]
Text=Toggled NumLock Off
[FlightIcon.On:S]
Text=[\xe539]
[FlightIcon.Off:S]
Text=[\xe539]
[FlightText.On:S]
Text=Airplane mode On
[FlightText.Off:S]
Text=Airplane mode Off

; ---------------------------------------------------------------------------- ;
;                                  MeterStyle                                  ;
; ---------------------------------------------------------------------------- ;

[String:S]
FontFace=#FontFace#
FontSize=(10*#scale#)
AntiAlias=1
FontColor=#FontColor#

; ---------------------------------------------------------------------------- ;
;                                   Measures                                   ;
; ---------------------------------------------------------------------------- ;

@includeMusic=#@#Includes\GlobalMusic#MediaType##Media#.inc

@includeBrightness=#@#Includes\LegacyBrightness#LegacyBright#.inc

[mVolume]
Measure=Plugin
Plugin=Win7AudioPlugin
DynamicVariables=1
OnChangeAction=[!UpdateMeterGroup Dynamic][!Redraw]
; UpdateDivider=1

; ---------------------------------------------------------------------------- ;
;                                    Content                                   ;
; ---------------------------------------------------------------------------- ;

@includeLayout=Layout\#Layout#.inc
