[Rainmeter]
Update=-1
SkinHeight=(#SCREENAREAHEIGHT#-1)
SkinWidth=#SCREENAREAWIDTH#
AccurateText=1
SolidColor=#SolidColor#,#SolidOpacity#
BackgroundMode=2
DefaultDraggable=0
DefaultKeepOnScreen=1
DefaultSavePosition=0

[Variables]
@includeVars=Vars.inc
@includeOtherVars=#@#vars.inc

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=#UnloadBlur#
OnUpdateAction=[!Move [#SCREENAREAX@#MonitorIndex#] [#SCREENAREAY@#MonitorIndex#]]

[MeterString]
Meter=String

; [Focus]
; Measure=Plugin
; Plugin=Focus
