[Rainmeter]
Update=-1
DefaultSavePosition=0
DefaultAlwaysOnTop=-2
DefaultDraggable=0
DefaultSnapEdges=0
DefaultStartHidden=1
DefaultAlphaValue=0
DefaultHideOnMouseOver=0
DefaultFadeDuration=0
DefaultClickThrough=1
DefaultKeepOnScreen=0
DefaultAutoSelectScreen=0
OnCloseAction=[!WriteKeyValue m.onload disabled 0]

[m.OnLoad]
Measure=Calc
Formula=Counter
IfCondition=m.OnLoad = 1
IfTrueAction=[!Delay 1000][!ActivateConfig "Inlay\Main\Accessories\ShortcutsEditor"]
IfFalseAction=[!Refresh "Inlay\Main\Accessories\ShortcutsEditor"]
IfConditionMode=1
disabled=0

[p.PSRM]
Measure=Plugin
Plugin=PowerShellRM
ScriptFile=#@#Powershell\ShortcutFunc.ps1
ExecutionPolicy=Unrestricted

[Dum]
Meter=String
