[Rainmeter]
Update=(#BoostRate# = 1 ? 0 : 16)
AccurateText=1
DefaultKeepOnScreen=0
DefaultAlwaysOnTop=-2
@includeCtx=#SKINSPATH##MosaicShell\CoreShell\}{CtxItms.inc

[Variables]
@includeMainVariable=#@#vars.inc
Sec.Ctx.Pos=1
@includeVariables=#@#Vars\[#VisualizerType].inc
@includeAnalyzer=#@#Vars\AudioAnalyzerSettings.inc
@includeColors=#@#Vars\Colors.inc

[AudioAnalyzer]
@includeAnalyzer=#SKINSPATH#..\CoreData\#ROOTCONFIG#\Measures\[#VisualizerType]Analyzer.inc
@includeMeasures=#SKINSPATH#..\CoreData\#ROOTCONFIG#\Measures\AudioMeasures.inc

[Visualizer]
@includeVisualizer=#SKINSPATH#..\CoreData\#ROOTCONFIG#\Visualizer\[#VisualizerType].inc

[ImageUnderlay]
@IncludeImageUnderlay=#@#ImageUnderlay\ImageUnderlay[#ImageUnderlay].inc
