name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build .rmskin and publish release
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git zip github-cli
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=dev-$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync version in RMSKIN.ini
        run: sed -i "s|^Version=.*|Version=${{ steps.tag.outputs.name }}|" RMSKIN.ini

      - name: Build MosaicShell.rmskin
        run: |
          PKG=$(mktemp -d)
          SKIN="$PKG/Skins/#MosaicShell"
          mkdir -p "$SKIN"

          for dir in @Resources Accessories Core CoreShell Ctx Main S-Hub; do
            [ -d "$dir" ] && cp -r "$dir" "$SKIN/"
          done

          cp RMSKIN.ini "$PKG/"

          cd "$PKG"
          zip -r "$GITHUB_WORKSPACE/MosaicShell.rmskin" . -x "*.git*"

      - name: Create GitHub release
        run: |
          gh release create ${{ steps.tag.outputs.name }} MosaicShell.rmskin \
            --title "MosaicShell ${{ steps.tag.outputs.name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
