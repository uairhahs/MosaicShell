name: Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build-and-release:
    name: Build Host zip and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: tag
        run: |
          $name = (Get-Date -AsUTC).ToString("yyyy.M.d") + "-b${{ github.run_number }}"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release tag: $name"

      - name: Test
        working-directory: host
        run: dotnet test MosaicShell.Core.Tests --configuration Release --nologo

      - name: Publish Host variants + Mosaicist + Installer
        working-directory: host
        env:
          BUILD_VERSION: ${{ steps.tag.outputs.name }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $version = $env:BUILD_VERSION
          Write-Host "Stamping version: $version"

          dotnet publish MosaicShell.Host `
            -c Release -r win-x64 --self-contained false `
            -p:Version=$version `
            -o (Join-Path $out "Host-fw")

          dotnet publish MosaicShell.Host `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$version `
            -o (Join-Path $out "Host-sc")

          # Classic Host/ alias (framework-dependent) for older docs and tooling
          Copy-Item -Recurse -Force (Join-Path $out "Host-fw") (Join-Path $out "Host")

          dotnet publish Mosaicist `
            -c Release -r win-x64 --self-contained false `
            -p:Version=$version `
            -o (Join-Path $out "Mosaicist")

          dotnet publish MosaicShell.Installer `
            -c Release -r win-x64 --self-contained false `
            -p:Version=$version `
            -o (Join-Path $out "Installer")

          Copy-Item -Recurse -Force `
            (Join-Path $env:GITHUB_WORKSPACE "Tiles") `
            (Join-Path $out "Tiles")

          Set-Content -Path (Join-Path $out "VERSION.txt") -Value $version -Encoding utf8

          @"
          MosaicShell release $version

          Recommended: run Installer\MosaicShell.Installer.exe and follow the wizard.

          Bundle layout:
            Installer\   GUI setup (framework-dependent; needs .NET 10 Desktop Runtime)
            Host-fw\     Host without bundled runtime
            Host-sc\     Host self-contained (includes runtime)
            Host\        Same as Host-fw (compat alias)
            Mosaicist\   Module install CLI
            Tiles\       Native module stubs

          Framework-dependent apps need the .NET 10 Desktop Runtime (Windows x64):
          https://dotnet.microsoft.com/download/dotnet/10.0

          Manual fallback (without the GUI):
            1. Extract this zip.
            2. Mosaicist\Mosaicist.exe install-module Tessera
            3. Host-fw\MosaicShell.Host.exe   (or Host-sc\ if you skip the runtime install)

          Docs: https://github.com/${{ github.repository }}/blob/main/README.md
          "@.Trim() | Set-Content -Path (Join-Path $out "README.txt") -Encoding utf8

      - name: Zip release
        id: zip
        run: |
          $name = "${{ steps.tag.outputs.name }}"
          $zip = Join-Path $env:GITHUB_WORKSPACE "MosaicShell-$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "artifacts\*") -DestinationPath $zip
          "path=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Created $zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $name = "${{ steps.tag.outputs.name }}"
          $zip = "${{ steps.zip.outputs.path }}"
          gh release create $name $zip `
            --title "MosaicShell $name" `
            --generate-notes `
            --prerelease `
            --target "${{ github.sha }}"
