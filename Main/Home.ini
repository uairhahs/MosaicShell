[Rainmeter]
Update=-1
DefaultWindowX=100
DefaultWindowY=100
DefaultUpdateDivider=-1
DynamicWindowSize=1
AccurateText=1
SkinWidth=(#Set.W#)
SkinHeight=(#Set.H#)
@includeCtx=#SKINSPATH##MosaicShell\CoreShell\}{CtxItms.inc

[Variables]
@includeCacheVarsHome=#@#CacheVars\Home.inc
Sec.Container=BC
Sec.Ctx.Pos=1
Sec.AnchorName=Anchor
Sec.drag_bar_text=Home
HomePage.P=(100*[Set.S])

; ---------------------------------------------------------------------------- ;
;                                   Functions                                  ;
; ---------------------------------------------------------------------------- ;

@includeCommonFunctions=#ROOTCONFIGPATH#CoreShell\Common\Functions.inc
Sec.Page=1

[m.ShowInToolbar]
WindowTitle=MosaicShell

[DefaultStartActions]
Custom1=[!Draggable 1][!KeepOnScreen 0][!SetOption #Sec.AnchorName# Y [#Sec.AnchorName#:Y]][!EnableMeasure AnchorChecker][!UpdateMeasure AnchorChecker]

[AnchorChecker]
Measure=Calc
Formula=(Clamp([BC:H]-[#Sec.AnchorName#:Y], -5000, 0))
IfCondition=AnchorChecker=0
IfTrueAction=[!DisableMouseAction BC "MouseScrollUpAction|MouseScrollDownAction"][!UpdateMeterGroup Background][!Redraw]
IfFalseAction=[!ShowMeter ScrollBar][!UpdateMeterGroup Background][!Redraw]
IfConditionMode=1
Group=AnchorChecker
DynamicVariables=1
Disabled=1

[MouseScrollBar]
Measure=Plugin
Plugin=Mouse
MouseMoveAction=[!SetVariable Scroll "(Clamp(($MouseY$-#ScrollClickedPos#-[BC:Y])/(#Set.H#/2-#Set.P#)*[AnchorChecker],[AnchorChecker],0))"][!UpdateMeter *][!Redraw]
LeftMouseUpAction=[!SetOption ScrollBar MeterStyle ScrollBar:Idle][!SetOption ScrollBar Fill "Stroke Color #Set.Ter_Color#"][!CommandMeasure MouseScrollBar "Stop"][!DisableMeasure MouseScrollBar][!UpdateMeter ScrollBar][!Redraw]
RequireDragging=1
RelativeToSkin=1
DynamicVariables=1
Disabled=1

; ---------------------------------------------------------------------------- ;
;                                   Functions                                  ;
; ---------------------------------------------------------------------------- ;

[p.SysInfo.USER_NAME]
Measure=Plugin
Plugin=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1

[0.Container]
Meter=String
; To avoid errors

[m.CheckGuide]
Measure=String
STring=#PostWelcome.Guide##PostWelcome.GameMode#
DynamicVariables=1
IfMatch=^1.$
IfMatchAction=[!WriteKeyValue Variables Set.W (#SCREENAREAWIDTH#*0.65) "#@#Vars.inc"][!WriteKeyValue Variables Set.H (0.65*#SCREENAREAWIDTH#*3/4) "#@#Vars.inc"][!WriteKeyValue Set.S Formula "((#SCREENAREAWIDTH#/1920) < (#SCREENAREAHEIGHT#/1080) ? (#SCREENAREAWIDTH#/1920) : (#SCREENAREAHEIGHT#/1080))" "#@#Vars.inc"][!SetOption Set.S Formula "((#SCREENAREAWIDTH#/1920) < (#SCREENAREAHEIGHT#/1080) ? (#SCREENAREAWIDTH#/1920) : (#SCREENAREAHEIGHT#/1080))"][!UpdateMeasure Set.S][!SetVariable Set.W (#SCREENAREAWIDTH#*0.65)][!SetVariable Set.H (0.65*#SCREENAREAWIDTH#*3/4)][!UpdateMeter *][!Redraw][!Move (#SCREENAREAWIDTH#*(0.5-0.65/2)) (#SCREENAREAHEIGHT#/2-#SCREENAREAWIDTH#*0.65*0.75/2)]
IfMatch2=^.1$
IfMatchAction2=[!Manage GameMode]

[LogicalScript]
Measure=Script
ScriptFile=#ROOTCONFIGPATH#Accessories\UpdatePrompt\Logic.lua

; ------------------------------- Version check ------------------------------ ;

[WebParser]
Measure=WebParser
URL=https://raw.githubusercontent.com/uairhahs/MosaicShell/main/%40Resources/Version.inc
RegExp==(.*)$
Group=BackgroundMeasures
Disabled=(0)
FinishAction=[!CommandMeasure LogicalScript "check()"]
CodePage=1200

[mVer]
Measure=WebParser
URL=[WebParser]
Group=BackgroundMeasures
Disabled=(0)
StringIndex=1
CodePage=1200

; ---------------------------------------------------------------------------- ;
;                                  MeterStyles                                 ;
; ---------------------------------------------------------------------------- ;

[Header.Link.Shape:S]
X=(-30*[Set.S])r
Y=(16*[Set.S])r
Shape=Ellipse 0,0,(24*[Set.S]) | StrokeWidth 0 | Extend This | OffSet (-24*[Set.S]),0
This=Fill Color #Set.Subtext_Color#,75 | Scale 1,1
CoreGrad=45 | #Set.Accent_Color_2# ; 1 | #Set.Accent_Color# ;0
MouseOverAction=[!SetOption "#CURRENTSECTION#" This "Fill LinearGradient CoreGrad | Scale 1.2,1.2"][!UpdateMeter "#CURRENTSECTION#"][!Redraw]
MouseLeaveAction=[!SetOption "#CURRENTSECTION#" This "Fill Color #Set.Subtext_Color#,75 | Scale 1,1"][!UpdateMeter "#CURRENTSECTION#"][!Redraw]
DynamicVariables=1
Container=#Sec.Container#
[Header.Link.Image:S]
X=(-40*[Set.S])r
Y=(-16*[Set.S])r
W=(32*[Set.S])
H=(32*[Set.S])
DynamicVariables=1
Container=#Sec.Container#

@includeCommonStyles=#ROOTCONFIGPATH#CoreShell\Common\Styles.inc
; ---------------------------------------------------------------------------- ;
;                                    Content                                   ;
; ---------------------------------------------------------------------------- ;

; -------------------------------- Background -------------------------------- ;

[B]
Meter=Shape
X=(#Set.WinB#/2)
Y=(#Set.WinB#/2)
Shape=Rectangle 0,0, #Set.W#, #Set.H#, (#Set.WinR#*(1-#Set.Maximized#)) | StrokeWidth #Set.WinB# | Fill Color #Set.Pri_Color#,#Set.Alpha# | Stroke Color #Set.Ter_Color#
MouseActionCursor=0
DynamicVariables=1

[BC]
Meter=Shape
Y=#Set.TitleBarH#
Shape=Rectangle 0,0, #Set.W#, (#Set.H#-#Set.TitleBarH#), #Set.WinR# | StrokeWidth 0 | Fill Color #Set.Pri_Color#
MouseActionCursor=0
DynamicVariables=1
MouseScrollDownAction=[!SetVariable Scroll "(Clamp(#Scroll#-50,[AnchorChecker],0))"][!UpdateMeter *][!Redraw]
MouseScrollUpAction=[!SetVariable Scroll "(Clamp(#Scroll#+50,[AnchorChecker],0))"][!UpdateMeter *][!Redraw]

; ---------------------------------- Content --------------------------------- ;

@includePages=#ROOTCONFIGPATH#CoreShell\Home\Pages\Page#Sec.Page#.inc

; --------------------------------- Fallback --------------------------------- ;

[Fallback.String]
Meter=String
Text=Welcome to MosaicShell#CRLF#Your desktop, composed.
X=(#Set.W#/2)
Y=(#Set.H#/2)
Hidden=1
LeftMouseUpAction=["https://github.com/uairhahs/MosaicShell"]
StringAlign=CenterCenter
MeterStyle=Set.String:S

; ---------------------------------- Footer ---------------------------------- ;

@includeWindowControls=#ROOTCONFIGPATH#CoreShell\Common\WindowControls.inc

[CommandBar.Shape]
Hidden=1
[CommandBar.String]
